name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  backend:
    name: Backend — vet, build e testes de integração
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/argus_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://argus_app:argus_app@localhost:5432/argus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Create restricted app role (RLS)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d argus_test -c "CREATE ROLE argus_app LOGIN PASSWORD 'argus_app';"
      - name: Tests (race)
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend — typecheck, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
